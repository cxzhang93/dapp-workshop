name: Workshop tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
        working-directory: lock
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
        working-directory: lock/webapp
      - run: npm test
        working-directory: lock
      - run: npm run build
        working-directory: lock

  election:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
        working-directory: election
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
        working-directory: election/client
      - run: npm test
        working-directory: election
      - run: npm run build
        working-directory: election

  tokenization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: HUSKY=0 node .yarn/releases/yarn-4.13.0.cjs install --immutable
        working-directory: tokenization
      - run: node .yarn/releases/yarn-4.13.0.cjs test
        working-directory: tokenization
      - run: node .yarn/releases/yarn-4.13.0.cjs next:check-types
        working-directory: tokenization
